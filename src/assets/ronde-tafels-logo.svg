<svg width="400" height="400" viewBox="0 0 400 400" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>First Floor Ronde Tafels</title>
  <desc>Blauw cirkelvormig logo met de tekst Ronde Tafels en tagline Alles op tafel</desc>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;700&amp;display=swap');
      .logo-title { font-family: 'Sora', sans-serif; font-weight: 700; font-size: 30px; fill: #ffffff; letter-spacing: 3px; }
      .logo-tag { font-family: 'Sora', sans-serif; font-weight: 400; font-size: 18px; fill: #ffffff; letter-spacing: 1px; }
    </style>
  </defs>

  <circle cx="200" cy="200" r="190" fill="#315eff"/>

  <text x="200" y="188" text-anchor="middle" class="logo-title">RONDE TAFELS</text>

  <rect x="148" y="202" width="104" height="2" rx="1" fill="#f9b8c4" opacity="0.9"/>

  <text x="200" y="234" text-anchor="middle" class="logo-tag">Alles op tafel.</text>
</svg>
